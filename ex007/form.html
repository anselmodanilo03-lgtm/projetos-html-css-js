<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        form {
            width: 400px;
        }

        #botoes {
            text-align: center;
        }
    </style>
</head>
<body>
    <form action="../cadastro.php" method="post">
        <fieldset>
            <legend>Formulário de Matrícula</legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" required placeholder="Digite seu nome completo" maxlength="40">
            </p>
            <p>
                <label for="inasc">Data de Nascimento: </label>
                <input type="date" name="nasc" id="inasc" required>
            </p>
            <p>
                <label for="icpf">CPF: </label>
                <input type="text" name="cpf" id="icpf" required placeholder="Digite seu CPF" maxlength="11">
            </p>
            <p>
                <label for="itel">Telefone: </label>
                <input type="tel" name="tel" id="itel" required placeholder="Digite seu telefone" >
            </p>   
            <p>
                <label for="i-email">Email: </label>
                <input type="email" name="e-mail" id="i-email" size="25" required placeholder="Digite seu email" maxlength="50">
            </p>
        </fieldset>
        <fieldset>
            <p>
                <label for="iestado">Estado: </label>
                <select name="estado" id="iestado" required>
                    <option value="" selected>-------- Escolha --------</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                </select>
            </p>
            <p>
                <label for="icidade">Cidade: </label>
                <input type="text" name="cidade" id="icidade" required maxlength="40">
            </p>
            <p>
                <label for="icurso">Curso: </label>
                <select name="curso" id="icurso" required>
                    <option value="" selected>------------------ Escolha ---------------------</option>
                    <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                    <option value="cc">Ciência da Computação</option>
                    <option value="si">Sistemas de Informação</option>
                    <option value="adm">Administração</option>
                    <option value="cont">Ciências Contábeis</option>
                </select>
            </p>
        </fieldset>
        <fieldset>
            <p>
                <p>Modalidade: </p>
                <input type="radio" name="modalidade" id="presencial" required>
                <label for="presencial">Presencial</label>

                <input type="radio" name="modalidade" id="online">
                <label for="online">Online</label>
            </p>
            <p>
                <p>Tecnologias: </p>
                <input type="checkbox" name="linguagem" id="ihtml"> <label for="linguagem">HTML</label><br>
                <input type="checkbox" name="linguagem" id="icss"> <label for="linguagem">CSS</label><br>
                <input type="checkbox" name="linguagem" id="ijs"> <label for="linguagem">JavaScript</label>
            </p>
            <p>
                <textarea name="mensagem" id="imensagem" placeholder="Deixe uma sugestão de melhoria" rows="5" cols="30"></textarea>
            </p>
            <p id="botoes">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>

    </form>
</body>
</html>
