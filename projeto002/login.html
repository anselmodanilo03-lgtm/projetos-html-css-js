<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Login Responsivo</h1>
    <form action="../cadastro.php" method="post">
        <h2>Login</h2>
        <p>
            <label for="iusuario">Usuário: </label>
            <input type="text" name="usuario" id="iusuario" placeholder="Seu nome de usuário" required>
        </p>
        <p>
            <label for="isenha">Senha: </label>
            <input type="password" name="senha" id="isenha" placeholder="Sua senha" required minlength="8" maxlength="16">
        </p>
        <input type="submit" value="Entrar" id="entrar">
    </form>
</body>
</html>
